name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests and stdio smoke
        run: ./gradlew build --console=plain
      - name: Loki 2.6.1 / 3.6.0 in Testcontainers
        run: ./gradlew integrationTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: loki-mcp-server
          path: build/libs/loki-mcp-server.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: build/reports/tests
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: loki-mcp-server
      - name: Name the jar after the tag
        run: cp loki-mcp-server.jar "loki-mcp-server-${GITHUB_REF_NAME}.jar"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            loki-mcp-server-${{ github.ref_name }}.jar
            loki-mcp-server.jar
          generate_release_notes: true
